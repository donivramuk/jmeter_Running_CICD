name: JMeter Script 03 (load parameters)

on:
  push:
    branches: [main]
    paths:
      - 'jmeter_scripts/**'
      - 'test-data/**'
      - '.github/workflows/jmeter-03.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of virtual users (threads)'
        default: '1'
        required: false
      ramp_up:
        description: 'Ramp-up time in seconds'
        default: '1'
        required: true
      duration:
        description: 'Maximum test duration in seconds'
        default: '300'
        required: true
      iterations:
        description: 'Iterations per user (-1 = run until duration ends)'
        default: '1'
        required: true
      think_time:
        description: 'Think time between transactions in ms'
        default: '5000'
        required: true
      think_time_random:
        description: 'Extra random think time range in ms (0 - value)'
        default: '100'
        required: true
      data_file:
        description: 'Path to the CSV test data file'
        default: 'test-data/user_cred.csv'
        required: true

env:
  JMETER_VERSION: '5.6.3'
  JMX_FILE: 'jmeter_scripts/advBanking_multiuser_multiparam.jmx'
  USERS: ${{ github.event.inputs.users || '1' }}
  RAMP_UP: ${{ github.event.inputs.ramp_up || '1' }}
  DURATION: ${{ github.event.inputs.duration || '300' }}
  ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
  THINK_TIME: ${{ github.event.inputs.think_time || '5000' }}
  THINK_TIME_RANDOM: ${{ github.event.inputs.think_time_random || '100' }}
  DATA_FILE: ${{ github.event.inputs.data_file || 'test-data/user_cred.csv' }}

jobs:
  jmeter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf jmeter.tgz

      - name: Verify test data file
        run: |
          test -f "$DATA_FILE" || { echo "Data file not found: $DATA_FILE"; exit 1; }
          echo "Using data file $DATA_FILE ($(($(wc -l < "$DATA_FILE") - 1)) rows)"

      - name: Run JMeter test
        run: |
          mkdir -p results
          apache-jmeter-${JMETER_VERSION}/bin/jmeter -n \
            -t "$JMX_FILE" \
            -JdataFile="$GITHUB_WORKSPACE/$DATA_FILE" \
            -Jusers="$USERS" \
            -JrampUp="$RAMP_UP" \
            -Jduration="$DURATION" \
            -Jiterations="$ITERATIONS" \
            -JthinkTime="$THINK_TIME" \
            -JthinkTimeRandom="$THINK_TIME_RANDOM" \
            -l results/results.jtl \
            -j results/jmeter.log \
            -e -o results/html-report

      - name: Fail on sampler errors
        run: |
          errors=$(awk -F',' 'NR>1 && $8=="false"' results/results.jtl | wc -l)
          total=$(($(wc -l < results/results.jtl) - 1))
          echo "Samples: $total, Errors: $errors"
          {
            echo "### JMeter script 03: $total samples, $errors errors"
            echo "| Users | Ramp-up (s) | Duration (s) | Iterations | Think time (ms) | Random (ms) |"
            echo "|---|---|---|---|---|---|"
            echo "| $USERS | $RAMP_UP | $DURATION | $ITERATIONS | $THINK_TIME | $THINK_TIME_RANDOM |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$errors" -gt 0 ]; then exit 1; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-script-03
          path: results/